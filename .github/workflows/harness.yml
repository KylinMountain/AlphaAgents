name: Harness

# The mechanical half of the harness. Everything here exists because a
# rule nobody checks is a wish — see docs/GOLDEN_PRINCIPLES.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  invariants:
    name: Invariants and knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint_docs checks freshness from git timestamps, which a
          # shallow clone does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Architectural invariants
        run: uv run python scripts/lint_harness.py

      - name: Knowledge base
        run: uv run python scripts/lint_docs.py

      - name: Policy contamination
        # Judgement that reached the agent without passing the evidence door:
        # a tool docstring saying "ROE > 15% = 优质企业", a prompt asserting
        # "价格是结果，资金是原因". An unlabelled claim fails; a labelled
        # prior (〔先验〕/〔approved〕) passes, because the problem is not
        # having priors — it is having them without saying so.
        # See tests/test_policy_contamination.py.
        run: uv run python scripts/lint_policy.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Run tests
        # Tests that need data/market_history.db (1.1GB, not in the repo)
        # are skipped rather than failing the build; they are exercised
        # locally where the file exists.
        run: uv run pytest tests/ -q --no-header

  frontend:
    name: Frontend render check and report markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build the bundle the server serves
        working-directory: web
        run: npm run build

      - name: Render check
        # The only check that can fail on a workspace page rendering "never
        # wired" as "no news": `lint` and `build` are green on it, and it is
        # invisible in a screenshot. It caught three such bugs the day it was
        # written, and until now it ran only when someone remembered.
        working-directory: web
        run: npm run check:render

      - name: Report markdown
        # Plain node, no dependencies: the module under test is a plain .js.
        run: node --test tests/test_report_markdown.mjs
