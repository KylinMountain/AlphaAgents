# Images are built and published by GitHub Actions to ghcr.io.
# Pin a release with IMAGE_TAG (e.g. v0.1.0); defaults to the main build.
services:
  scheduler:
    image: ghcr.io/kylinmountain/alphaagents:${IMAGE_TAG:-main}
    container_name: alphaagents-scheduler
    restart: always
    command: python main.py run-v2
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    # The box runs ~10 other containers on 7.6Gi; cap this one so an
    # embedding or backtest burst cannot starve them.
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional pipeline UI. Host port 8002 — 8000/8001 belong to TradingAgents.
  # Start with: docker compose --profile web up -d
  #
  # --profile web is required on EVERY deploy, not just the first. A plain
  # `docker compose pull && up -d` skips profiled services without saying
  # so: the scheduler moves to the new image, the UI silently keeps
  # serving the old bundle, and the frontend fix you just shipped is
  # nowhere to be seen.
  web:
    image: ghcr.io/kylinmountain/alphaagents:${IMAGE_TAG:-main}
    container_name: alphaagents-web
    restart: always
    profiles: ["web"]
    # --no-monitor: the scheduler container owns the pipeline. Without it
    # this process runs its own monitor loop, so both containers digest
    # the same news with the same LLM, doubling the token bill for output
    # that lands in one shared DB.
    #
    # --no-ingest: --no-monitor alone leaves the web process sweeping every
    # source on its own timer as a fallback for running without a
    # scheduler. Here the scheduler already runs news_ingest every 5
    # minutes, so that fallback only fetches the same feeds twice — free in
    # tokens, not free in rate limits: twitter starts answering 429 to both.
    command: python main.py web --host 0.0.0.0 --port 8000 --no-monitor --no-ingest
    ports:
      - "8002:8000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
