[project]
name = "alpha-agents"
version = "0.1.0"
description = "News-driven autonomous stock screening system"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "akshare",
    "baostock>=0.9.3",
    "anyio",
    "chromadb>=1.5.5",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "openai-agents>=0.16.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "websockets>=16.0",
    "tiktoken>=0.7.0",
    "trafilatura>=1.8.0",
    "ddgs>=9.14.1",
    "beautifulsoup4>=4.12.0",
    "json-repair>=0.58.7",
    "prompt-toolkit>=3.0.52",
    "rich>=14.3.3",
    "tushare>=1.4.29",
    "pandas>=2.0.0",
    "mini-racer>=0.14.0",
    "schedule>=1.2.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
alpha-agents = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpha_agents*"]

[tool.uv]
package = true
